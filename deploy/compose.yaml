# MITT website - single-host deployment with Docker Compose
#
#   cp .env.example .env.production   # fill in, never commit
#   docker compose -f deploy/compose.yaml --env-file .env.production up -d --build
#
# Put TLS in front of this: either terminate at the host nginx (see deploy/nginx.conf),
# or uncomment the caddy service below and drop the ports mapping.

services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        # Baked into the client bundle at build time. Must be the real public origin.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set NEXT_PUBLIC_SITE_URL}
    image: mitt-website:latest
    restart: unless-stopped
    env_file:
      - ../.env.production
    environment:
      NODE_ENV: production
      PORT: "3000"
      MITT_LEAD_DIR: /app/var/enquiries
    volumes:
      # Enquiries live here. Back this up; it is the only irreplaceable state.
      - mitt-leads:/app/var/enquiries
    ports:
      # Bind to loopback only when a host reverse proxy terminates TLS.
      - "127.0.0.1:3000:3000"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Optional: automatic TLS without a host nginx.
  # caddy:
  #   image: caddy:2-alpine
  #   restart: unless-stopped
  #   ports: ["80:80", "443:443"]
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy-data:/data
  #     - caddy-config:/config

volumes:
  mitt-leads:
