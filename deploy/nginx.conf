# MITT website - host nginx reverse proxy with TLS
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/mitt
#   sudo ln -s /etc/nginx/sites-available/mitt /etc/nginx/sites-enabled/mitt
#   sudo certbot --nginx -d mitt.example.com          # replaces the placeholder cert paths
#   sudo nginx -t && sudo systemctl reload nginx

# Redirect all plain HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name mitt.example.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mitt.example.com;

    ssl_certificate     /etc/letsencrypt/live/mitt.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mitt.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # The app also emits HSTS; duplicated here so it is present even on error pages.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Enquiry bodies are small. A low cap removes an easy abuse vector.
    client_max_body_size 64k;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Immutable build assets: safe to cache hard, they are content-hashed.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Media changes rarely but is not hashed: cache briefly, revalidate.
    location /media/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=86400";
    }

    # The enquiry endpoint must never be cached.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite, do not append: the app derives the rate-limit key from the
        # first X-Forwarded-For hop, so a client-supplied value must not survive.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 30s;
    }
}
